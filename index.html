<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d2021">

  <link rel="icon" href="/favicon.ico">

  <!-- Open Graph & Twitter Card meta injected by React Helmet per page -->
  <title>exoad - Jiaming Meng</title>

  <!-- The photos page lands out of black. The veil is painted before any CSS or
       JS chunk resolves so a direct load never flashes the site background;
       PhotosPage lifts it once the grid has painted. Other routes never see it. -->
  <style>
    #veil { display: none; }

    html.is-photos-landing,
    html.is-photos-landing body { background: #000; }

    html.is-photos-landing #veil {
      display: block;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      pointer-events: none;
      opacity: 1;
    }

    html.is-photos-landing #veil.is-lifted {
      opacity: 0;
      /* Quick, to contrast with the slow turn of the mark that preceded it.
         !important so a site-wide reduced-motion reset can't cut the reveal to
         nothing — this is an opacity fade with no movement, which is what that
         preference asks for rather than what it asks to remove. */
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    /* A single square, turning a quarter-notch at a time while the grid loads. */
    html.is-photos-landing #veil-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 13px;
      height: 13px;
      margin: -7px 0 0 -7px;
      border: 1px solid #6a6a6a;
      animation: veil-turn 1.8s ease-in-out infinite;
    }

    /* Ends on 90deg, which for a square is indistinguishable from 0 — so the
       loop repeats without a visible snap back. */
    @keyframes veil-turn {
      0%        { transform: rotate(0deg); }
      35%, 60%  { transform: rotate(45deg); }
      95%, 100% { transform: rotate(90deg); }
    }

    /* Deliberately still turns under prefers-reduced-motion: it is a 13px mark
       turning in place, and it is the only signal that the page is working.
       That preference targets large or decorative movement, not this. */
  </style>
  <script>
    (function () {
      if (location.pathname.replace(/\/+$/, "") !== "/photos") return;
      var root = document.documentElement;
      root.classList.add("is-photos-landing");
      // Never strand the page behind an opaque veil if the app fails to boot.
      setTimeout(function () {
        var veil = document.getElementById("veil");
        if (veil) veil.classList.add("is-lifted");
      }, 4000);
    })();
  </script>
</head>
<body>
  <div id="veil"><span id="veil-mark"></span></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
